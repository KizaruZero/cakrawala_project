name: AI Code Review (9router)

# Review otomatis setiap PR dibuka / ada push baru.
# Syarat: tambah secret NINEROUTER_API_KEY di repo
# (Settings > Secrets and variables > Actions).
# Model review diatur lewat env REVIEW_MODEL (nama combo di 9router).

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

env:
  NINEROUTER_URL: https://ai.itskizaru.id/v1
  REVIEW_MODEL: Review   # <-- ganti dengan nama combo review di 9router

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil diff PR
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          gh pr diff "$PR" --repo "${{ github.repository }}" > /tmp/pr.diff || true
          # Batasi ukuran diff agar prompt tidak jebol (60k karakter)
          head -c 60000 /tmp/pr.diff > /tmp/pr_trunc.diff
          if [ ! -s /tmp/pr_trunc.diff ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Minta review ke 9router
        if: steps.diff.outputs.empty != 'true'
        env:
          NINEROUTER_API_KEY: ${{ secrets.NINEROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          with open('/tmp/pr_trunc.diff', encoding='utf-8', errors='replace') as f:
              diff = f.read()

          system = (
              "Kamu adalah senior code reviewer untuk tim software. "
              "Review diff pull request berikut dan tulis review dalam Bahasa Indonesia. "
              "Fokus: bug logika, edge case, error handling, potensi regression, dan masalah keamanan. "
              "Abaikan masalah style/formatting sepele kecuali fatal. "
              "Ikuti format output ini dengan tepat, termasuk emoji-nya: "
              "Mulai dengan '## Review Pull Request', lalu ringkasan 2-3 kalimat. "
              "Kelompokkan temuan ke dalam tiga seksi: "
              "'### 🔴 HIGH — perlu fix/keputusan sebelum merge' untuk bug/dampak serius, "
              "'### 🟡 MEDIUM' untuk masalah logika menengah, "
              "'### 🟢 LOW / perlu konfirmasi' untuk hal minor atau yang butuh konfirmasi. "
              "Setiap temuan HIGH/MEDIUM: beri nomor, judul singkat tebal, lalu baris file "
              "dengan format `<file>` → `<fungsi/area>`, kemudian penjelasan dan dampak konkretnya. "
              "Temuan LOW boleh satu-dua kalimat per poin. "
              "Tambahkan seksi '### ✅ Yang sudah bagus' berisi 2-4 hal yang sudah benar di PR ini. "
              "Akhiri dengan baris tebal 'Kesimpulan: layak merge' atau "
              "'Kesimpulan: belum layak merge' disertai satu kalimat alasan. "
              "Maksimal 10 temuan, prioritaskan yang paling berdampak. "
              "Setiap temuan harus merujuk ke file/fungsi yang ada di diff, jangan temuan generik. "
              "Jangan sertakan code block yang panjang."
          )
          payload = {
              # 9router saat ini selalu mengembalikan SSE, jadi pakai stream=True
              # dan parse SSE-nya (lihat bawah).
              "model": os.environ.get("REVIEW_MODEL", "Review"),
              "stream": True,
              "messages": [
                  {"role": "system", "content": system},
                  {"role": "user",
                   "content": f"Judul PR: {os.environ.get('PR_TITLE','')}\n\n```diff\n{diff}\n```"},
              ],
          }
          req = urllib.request.Request(
              os.environ["NINEROUTER_URL"].rstrip("/") + "/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['NINEROUTER_API_KEY']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          chunks = []
          with urllib.request.urlopen(req, timeout=300) as resp:
              for raw in resp:
                  line = raw.decode("utf-8", errors="replace").strip()
                  if not line.startswith("data:"):
                      continue
                  data = line[5:].strip()
                  if data == "[DONE]":
                      break
                  try:
                      obj = json.loads(data)
                  except json.JSONDecodeError:
                      continue
                  delta = (obj.get("choices") or [{}])[0].get("delta", {})
                  if delta.get("content"):
                      chunks.append(delta["content"])

          review = "".join(chunks).strip()
          if not review:
              raise SystemExit("9router mengembalikan review kosong")

          header = "<!-- 9router-review -->\n## Review Otomatis (9router)\n\n"
          footer = "\n\n---\n_Direview otomatis oleh AI. Bukan pengganti review manusia._\n"
          with open("/tmp/review.md", "w") as f:
              f.write(header + review + footer)
          print(f"review written, {len(review)} chars")
          PYEOF

      - name: Post / update komentar PR
        if: steps.diff.outputs.empty != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          # Kalau sudah ada komen review sebelumnya (per push baru), update saja
          # biar tidak spam — dikenali dari marker HTML di body.
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            -q '.[] | select(.body | contains("<!-- 9router-review -->")) | .id' | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" \
              -F body=@/tmp/review.md --silent
            echo "updated comment $EXISTING"
          else
            gh pr comment "$PR" --repo "$REPO" --body-file /tmp/review.md
            echo "posted new comment"
          fi
